name: Fix route puzzle instruction

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Correct route instruction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = "Tap the four locations in the order the mysterious purple case travelled."
          new = "Tap the five locations in the order the mysterious purple case travelled."
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit change if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix route puzzle instruction"
          git push
